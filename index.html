<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INSCALE SHOWROOM PRICE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="INSCALE">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=20260811-1">
</head>
<body id="top">
  <header class="topbar">
    <button class="brand-home" id="homeBtn" type="button" aria-label="맨 위로 이동">
      <span class="eyebrow">INSCALE SHOWROOM</span>
      <span class="title">PRICE &amp; SPEC</span>
    </button>

    <button id="resetBtn" class="reset-btn" type="button">초기화</button>
  </header>

  <main class="wrap">
    <section class="search-panel">
      <input
        id="searchInput"
        type="search"
        placeholder="상품명, 브랜드, 디자이너, 소재, 사이즈 검색"
        autocomplete="off"
      >

      <nav class="floor-tabs" aria-label="층별 필터">
        <button class="floor-btn is-active" type="button" data-type="all">전체</button>
        <button class="floor-btn" type="button" data-type="floor" data-value="B1">B1</button>
        <button class="floor-btn" type="button" data-type="floor" data-value="1F">1F</button>
        <button class="floor-btn" type="button" data-type="floor" data-value="2F">2F</button>
        <button class="floor-btn" type="button" data-type="floor" data-value="3F">3F</button>
        <button class="floor-btn" type="button" data-type="floor" data-value="4F">4F</button>
        <button class="floor-btn sale" type="button" data-type="sale">DP SALE</button>
        <button class="floor-btn stock" type="button" data-type="stock">CASSINA STOCK</button>
        <button class="floor-btn inbound" type="button" data-type="inbound">VITRA/ARTEK</button>
      </nav>

      <nav id="stockFilters" class="stock-filters" aria-label="Cassina 재고 카테고리 필터" hidden>
        <button class="stock-filter-btn is-active" type="button" data-stock-category="all">ALL</button>
        <button class="stock-filter-btn" type="button" data-stock-category="sofas">SOFAS</button>
        <button class="stock-filter-btn" type="button" data-stock-category="chaise">CHAISE</button>
        <button class="stock-filter-btn" type="button" data-stock-category="chairs">CHAIRS</button>
        <button class="stock-filter-btn" type="button" data-stock-category="tables">TABLES</button>
        <button class="stock-filter-btn" type="button" data-stock-category="cabinets">CABINETS</button>
      </nav>

      <nav id="inboundFilters" class="inbound-filters" aria-label="Vitra Artek 입고 필터" hidden>
        <button class="inbound-filter-btn is-active" type="button" data-inbound-filter="all">ALL</button>
        <button class="inbound-filter-btn" type="button" data-inbound-filter="vitra">VITRA</button>
        <button class="inbound-filter-btn" type="button" data-inbound-filter="artek">ARTEK</button>
        <button class="inbound-filter-btn" type="button" data-inbound-filter="seating">SEATING</button>
        <button class="inbound-filter-btn" type="button" data-inbound-filter="tables">TABLES</button>
        <button class="inbound-filter-btn" type="button" data-inbound-filter="storage">STORAGE</button>
        <button class="inbound-filter-btn" type="button" data-inbound-filter="accessories">ACCESSORIES</button>
      </nav>

      <div class="summary">
        <span id="countText">불러오는 중...</span>
        <span id="hintText" class="hint">MORE IMAGE는 쇼룸컷 슬라이드, INFO LINK는 홈페이지 이동입니다.</span>
      </div>
    </section>

    <section id="productList" class="product-list"></section>

    <section id="emptyState" class="empty-state" hidden>
      검색 결과가 없습니다.
    </section>
  </main>

  <section id="galleryModal" class="gallery-modal" hidden>
    <div class="gallery-backdrop" data-gallery-close></div>
    <article class="gallery-panel" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
      <button class="gallery-close" type="button" data-gallery-close aria-label="닫기">×</button>
      <div class="gallery-header">
        <p id="galleryBrand" class="gallery-brand"></p>
        <h2 id="galleryTitle" class="gallery-title"></h2>
        <p id="galleryCaption" class="gallery-caption"></p>
      </div>

      <div class="gallery-stage">
        <button id="galleryPrev" class="gallery-arrow gallery-prev" type="button" aria-label="이전 이미지">‹</button>
        <img id="galleryImage" src="" alt="">
        <button id="galleryNext" class="gallery-arrow gallery-next" type="button" aria-label="다음 이미지">›</button>
      </div>

      <div class="gallery-footer">
        <span id="galleryCounter" class="gallery-counter"></span>
        <div id="galleryDots" class="gallery-dots"></div>
      </div>
    </article>
  </section>

  <footer class="footer">
    <p>INSCALE internal showroom price list</p>
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function (error) {
          console.log("Service Worker registration failed:", error);
        });
      });
    }
  </script>
  <script src="script.js?v=20260811-1"></script>
</body>
</html>
